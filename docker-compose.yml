version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: efloravn-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: vn_plant
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vn_plant"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: efloravn-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:password@db:5432/vn_plant?schema=public"
      JWT_SECRET: "secret-key-change-in-prod"
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/generated
      - ./backend/public/uploads:/usr/src/app/public/uploads

  frontend:
    build: ./frontend
    container_name: efloravn-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:3000/api/v1"
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules

  adminer:
    image: adminer
    container_name: efloravn-adminer
    restart: always
    ports:
      - "8888:8080"

volumes:
  postgres_data:
